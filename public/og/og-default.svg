<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <!--
    BenXinAdmin OG 分享图（自绘，零版权 §10）。1200×630。
    纯几何 + 品牌渐变 + 系统字体文字，可被 sharp/resvg 栅格化为 PNG。
  -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0e1a"/>
      <stop offset="1" stop-color="#070b16"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0" r="0.9">
      <stop offset="0" stop-color="#2b6fff" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#2b6fff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2b6fff"/>
      <stop offset="0.55" stop-color="#7c5cff"/>
      <stop offset="1" stop-color="#19c6e6"/>
    </linearGradient>
    <linearGradient id="gradtext" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6fa0ff"/>
      <stop offset="0.5" stop-color="#b39bff"/>
      <stop offset="1" stop-color="#5fe6ff"/>
    </linearGradient>
    <pattern id="dots" width="34" height="34" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.4" fill="#ffffff" opacity="0.06"/>
    </pattern>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#dots)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- 品牌方块 logo -->
  <g transform="translate(96,150)">
    <rect width="92" height="92" rx="22" fill="url(#brand)"/>
    <text x="46" y="62" text-anchor="middle" font-family="Geist, Arial, sans-serif"
          font-size="40" font-weight="800" fill="#ffffff">BX</text>
  </g>

  <!-- eyebrow -->
  <text x="100" y="300" font-family="ui-monospace, Menlo, monospace" font-size="22"
        fill="#9fb4d8" letter-spacing="1">Open Source · Apache-2.0 · Commercial-Friendly</text>

  <!-- 主标题 -->
  <text x="96" y="372" font-family="Geist, Arial, sans-serif" font-size="64"
        font-weight="800" fill="url(#gradtext)">A production-ready admin</text>
  <text x="96" y="448" font-family="Geist, Arial, sans-serif" font-size="64"
        font-weight="800" fill="url(#gradtext)">foundation, open source</text>

  <!-- 副信息 -->
  <text x="100" y="520" font-family="Geist, Arial, sans-serif" font-size="26"
        fill="#c7d3ea">ThinkPHP 8 · Vue 3 · code generator · RBAC · pluggable storage</text>

  <!-- 品牌名 -->
  <text x="100" y="582" font-family="Geist, Arial, sans-serif" font-size="30"
        font-weight="700" fill="#ffffff">BenXinAdmin</text>

  <!-- 右侧装饰几何 -->
  <g opacity="0.9">
    <rect x="900" y="150" width="210" height="130" rx="16" fill="#ffffff" opacity="0.05"/>
    <rect x="900" y="296" width="100" height="100" rx="16" fill="url(#brand)" opacity="0.55"/>
    <rect x="1016" y="296" width="94" height="100" rx="16" fill="#ffffff" opacity="0.05"/>
    <rect x="900" y="412" width="210" height="68" rx="16" fill="#ffffff" opacity="0.05"/>
  </g>
</svg>
